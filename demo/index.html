<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Atalaya Control de Obra</title>
<meta name="description" content="Prototipo de plataforma de control de obra con BIM, capturas de campo e IA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: consola de obra. Rail lateral oscuro tipo plano de acero, lienzo claro de yeso, datos en mono. */
:root {
  --bg: #eceeeb;
  --surface: #fbfbf9;
  --surface-2: #e3e7e5;
  --line: #d0d6d3;
  --ink: #15212a;
  --ink-2: #48565f;
  --ink-3: #7a868d;
  --accent: #1c5f8f;
  --accent-ink: #ffffff;
  --accent-soft: #d8e6f0;
  --hivis: #f2b705;
  --rail: #14202a;
  --rail-ink: #c9d3d9;
  --rail-ink-2: #7f8f99;
  --rail-hover: #1e2e3a;
  --ground: #c9ccc4;
  --edge: #22313b;
  --ghost: #9aa6ad;
  --overlay: #18a8d8;
  --st-ok: #2f8a57;
  --st-ok-soft: #d5ebdd;
  --st-progress: #d68c06;
  --st-progress-soft: #f7e6c4;
  --st-review: #138a9e;
  --st-review-soft: #cdeaee;
  --st-late: #c3412b;
  --st-late-soft: #f6d9d3;
  --st-unknown: #7b68b0;
  --st-unknown-soft: #e4def3;
  --st-none: #a3adb3;
  --shadow: 0 1px 2px rgba(20, 32, 42, .06), 0 4px 16px rgba(20, 32, 42, .05);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151a; --surface: #151f26; --surface-2: #1d2a33; --line: #2a3943; --ink: #e5ebee; --ink-2: #a9b6bd; --ink-3: #74838b;
    --accent: #6eaad8; --accent-ink: #0b1620; --accent-soft: #1b3346; --rail: #0a1014; --rail-ink: #c9d3d9; --rail-ink-2: #6f7f89; --rail-hover: #16222b;
    --ground: #2a343a; --edge: #0b1217; --ghost: #5d6b73; --overlay: #3fc3ef;
    --st-ok: #4cb37a; --st-ok-soft: #173525; --st-progress: #eaa531; --st-progress-soft: #3a2c10; --st-review: #2fb6cb; --st-review-soft: #113338;
    --st-late: #e86a52; --st-late-soft: #3d1c16; --st-unknown: #a191d6; --st-unknown-soft: #2a2442; --st-none: #66737a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151a; --surface: #151f26; --surface-2: #1d2a33; --line: #2a3943; --ink: #e5ebee; --ink-2: #a9b6bd; --ink-3: #74838b;
  --accent: #6eaad8; --accent-ink: #0b1620; --accent-soft: #1b3346; --rail: #0a1014; --rail-ink: #c9d3d9; --rail-ink-2: #6f7f89; --rail-hover: #16222b;
  --ground: #2a343a; --edge: #0b1217; --ghost: #5d6b73; --overlay: #3fc3ef;
  --st-ok: #4cb37a; --st-ok-soft: #173525; --st-progress: #eaa531; --st-progress-soft: #3a2c10; --st-review: #2fb6cb; --st-review-soft: #113338;
  --st-late: #e86a52; --st-late-soft: #3d1c16; --st-unknown: #a191d6; --st-unknown-soft: #2a2442; --st-none: #66737a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: .92em; }
.small { font-size: 12px; }
.muted { color: var(--ink-3); font-weight: 400; }
.neg { color: var(--st-late); }
.warn { color: var(--st-progress); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ic { width: 18px; height: 18px; flex: none; }

/* ── Estructura ── */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--rail); color: var(--rail-ink); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; padding: 18px 12px; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; color: #fff; text-decoration: none; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand b { font: 800 19px/1 var(--f-display); font-stretch: 112%; letter-spacing: .06em; text-transform: uppercase; }
.brand small { display: block; font: 500 10px/1.3 var(--f-mono); color: var(--rail-ink-2); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.side-obra { border: 1px solid #263744; border-radius: var(--r); padding: 10px 12px; font-size: 12px; color: var(--rail-ink-2); }
.side-obra strong { display: block; color: var(--rail-ink); font-size: 13px; font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.navlink { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r); color: var(--rail-ink); text-decoration: none; font-weight: 500; position: relative; }
.navlink:hover { background: var(--rail-hover); }
.navlink[aria-current="page"] { background: var(--rail-hover); color: #fff; }
.navlink[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; background: var(--hivis); border-radius: 0 2px 2px 0; }
.navlink .ic { color: var(--rail-ink-2); }
.navlink[aria-current="page"] .ic { color: var(--hivis); }
.nav-badge { margin-left: auto; background: var(--hivis); color: #1a1a1a; font: 600 11px/18px var(--f-mono); min-width: 20px; text-align: center; border-radius: 9px; padding: 0 5px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: var(--rail-ink-2); padding: 0 8px; }
.user { display: flex; align-items: center; gap: 10px; color: var(--rail-ink); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #2c4250; display: grid; place-items: center; font: 600 12px var(--f-mono); color: #fff; flex: none; }
.user span { display: block; font-size: 11px; color: var(--rail-ink-2); }
.proto { border-top: 1px solid #263744; padding-top: 10px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 10px 28px; min-height: 52px; }
.crumbs { font-size: 13px; color: var(--ink-2); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs b { color: var(--ink); font-weight: 600; }
.topbar .spacer { flex: 1; }
.cutoff { font: 500 12px var(--f-mono); color: var(--ink-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.cutoff i { width: 8px; height: 8px; border-radius: 50%; background: var(--st-ok); box-shadow: 0 0 0 3px var(--st-ok-soft); }
#view { padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 18px; max-width: 1480px; width: 100%; }

/* ── Cabeceras ── */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 30px; font-weight: 750; font-stretch: 108%; letter-spacing: -.01em; line-height: 1.1; }
.page-head.compact h1 { font-size: 26px; }
.eyebrow { font: 500 11px/1.4 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.sub { margin: 6px 0 0; color: var(--ink-2); max-width: 75ch; }
.head-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ── Botones y controles ── */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 8px 13px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1.2; }
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-sm { padding: 5px 10px; font-size: 13px; }
.btn-sm .ic { width: 16px; height: 16px; }
.btn-lg { padding: 12px 20px; font-size: 15px; }
.btn-icon { padding: 6px; }
.btn .count { background: rgba(255, 255, 255, .22); border-radius: 9px; padding: 0 7px; font: 600 12px/18px var(--f-mono); }
select.btn { padding-right: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg.small button { padding: 4px 9px; font-size: 13px; }
.switch { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; }

/* ── Chips de estado ── */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; line-height: 1.6; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.st-ok { background: var(--st-ok-soft); color: var(--st-ok); }
.chip.st-progress { background: var(--st-progress-soft); color: var(--st-progress); }
.chip.st-review { background: var(--st-review-soft); color: var(--st-review); }
.chip.st-late { background: var(--st-late-soft); color: var(--st-late); }
.chip.st-unknown { background: var(--st-unknown-soft); color: var(--st-unknown); }
.chip.st-none { background: var(--surface-2); color: var(--ink-3); }

/* ── Tarjetas y rejillas ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px 10px; }
.card-h.wrap { flex-wrap: wrap; align-items: flex-start; }
.card-h h2 { font-size: 16px; font-weight: 700; font-stretch: 104%; }
.card-h h2 .muted { font: 400 13px var(--f-body); margin-left: 6px; }
.card-b { padding: 4px 18px 18px; }
.card-f { padding: 12px 18px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.pad { padding: 0 18px 14px; margin: 0; }
.grid { display: grid; gap: 18px; }
.g-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.span-2 { grid-column: span 1; }

/* ── KPI ── */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi-label { font: 500 11px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.kpi-value { font: 700 30px/1.05 var(--f-display); font-stretch: 96%; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi-foot { font-size: 12.5px; color: var(--ink-2); }
.meter { position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; margin: 4px 0 2px; }
.meter > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; }
.meter > b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); margin-left: -1px; }
.meter.thin { height: 6px; }
.meter.behind > i { background: var(--st-progress); }

/* ── Gráficos ── */
.chart { width: 100%; height: auto; display: block; }
.chart .grid, .gantt .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis, .gantt .axis, .plan .axis { fill: var(--ink-3); font: 11px var(--f-mono); }
.line-plan { fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 5 4; }
.line-real { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linejoin: round; }
.area-real { fill: var(--accent); opacity: .1; }
.line-cert { fill: none; stroke: var(--st-ok); stroke-width: 1.8; }
.today { stroke: var(--hivis); stroke-width: 2; }
.today-label { fill: var(--ink-2); font: 600 11px var(--f-mono); }
.gap { stroke: var(--st-late); stroke-width: 3; opacity: .6; }
.dot-real { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.dot-plan { fill: var(--surface); stroke: var(--ink-3); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend.in-card { padding: 10px 18px 14px; margin: 0; }
.legend i { display: inline-block; }
.lg-real { width: 16px; height: 3px; background: var(--accent); }
.lg-plan { width: 16px; border-top: 2px dashed var(--ink-3); }
.lg-cert { width: 16px; height: 2px; background: var(--st-ok); }
.sw { width: 11px; height: 11px; border-radius: 2px; }
.sw.st-ok { background: var(--st-ok); } .sw.st-progress { background: var(--st-progress); } .sw.st-review { background: var(--st-review); }
.sw.st-none { background: var(--ghost); opacity: .5; } .sw.st-late { background: var(--st-late); } .sw.st-unknown { background: var(--st-unknown); }
.tick-ic { display: inline-block; width: 2px; height: 11px; background: var(--ink); vertical-align: -1px; }

/* ── Avisos ── */
.alert-list { list-style: none; margin: 0; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; padding: 10px 8px; border-radius: var(--r); position: relative; }
.alert + .alert { border-top: 1px solid var(--line); border-radius: 0; }
.alert-ic { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; grid-row: span 2; }
.alert-ic .ic { width: 16px; height: 16px; }
.sev-crit .alert-ic { background: var(--st-late-soft); color: var(--st-late); }
.sev-warn .alert-ic { background: var(--st-progress-soft); color: var(--st-progress); }
.sev-info .alert-ic { background: var(--st-review-soft); color: var(--st-review); }
.alert-txt strong { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.35; }
.alert-txt span { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.alert .btn { grid-column: 2; justify-self: start; margin-top: 4px; }
.more { margin: auto 18px 16px; align-self: flex-start; border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; }

/* ── Barras por capítulo ── */
.bars { list-style: none; margin: 0; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 11px; }
.bars-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.bars-top b { font-variant-numeric: tabular-nums; font-weight: 600; }

/* ── Pasos y actividad ── */
.steps, .feed { list-style: none; margin: 0; padding: 0 18px 16px; }
.steps li, .feed li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.steps li:first-child, .feed li:first-child { border-top: 0; }
.steps time, .feed time { font: 500 12px/1.6 var(--f-mono); color: var(--ink-3); }
.steps strong { display: block; font-weight: 600; }
.steps span { font-size: 12.5px; color: var(--ink-2); }
.steps em { font-style: normal; color: var(--ink-3); }
.steps li.flag em { color: var(--st-late); font-weight: 500; }
.feed li { grid-template-columns: 92px minmax(0, 1fr); font-size: 13px; }

/* ── Visor ── */
.viewer-host { position: relative; height: min(68vh, 640px); min-height: 360px; background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%); overflow: hidden; touch-action: none; }
.viewer-host.small { height: 360px; min-height: 0; }
.viewer-canvas { display: block; cursor: grab; }
.viewer-canvas:active { cursor: grabbing; }
.model-card .viewer-host { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.viewer-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.viewer-card { overflow: hidden; }
.viewer-toolbar { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.levels { display: flex; gap: 4px; flex-wrap: wrap; }
.levels button { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 3px 9px; font: 500 12px var(--f-mono); cursor: pointer; color: var(--ink-2); }
.levels button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.timeline { display: flex; align-items: center; gap: 12px; padding: 8px 14px 14px; border-top: 1px solid var(--line); }
.timeline input { flex: 1; accent-color: var(--accent); min-width: 0; }
.timeline output { font: 500 12px var(--f-mono); color: var(--ink-2); min-width: 120px; text-align: right; }
.inspector { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
.insp-state { margin-bottom: 12px; }
.dl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 7px 10px; margin: 0; font-size: 13px; }
.dl dt { color: var(--ink-3); font-size: 12px; padding-top: 1px; }
.dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.mini { font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 8px; }
.kv { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
.kv li { display: flex; justify-content: space-between; align-items: center; }
.kv b { font-variant-numeric: tabular-nums; }
.stage-list, .evid { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
.stage-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stage-list em { font-style: normal; color: var(--ink-3); font-size: 12px; }
.evid li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.evid li > span { color: var(--ink-3); font-size: 12px; }
.evid a { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; text-decoration: none; }
.evid .ic { width: 16px; height: 16px; color: var(--st-ok); }
.chain { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0; counter-reset: c; }
.chain li { position: relative; padding: 6px 0 6px 26px; font-size: 13px; }
.chain li::before { content: ""; position: absolute; left: 6px; top: 12px; width: 9px; height: 9px; border-radius: 2px; background: var(--accent); }
.chain li:not(:last-child)::after { content: ""; position: absolute; left: 10px; top: 22px; bottom: -8px; width: 1px; background: var(--line); }
.chain.big li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; padding: 9px 0 9px 26px; }
.chain.big li span { color: var(--ink-2); }

/* ── Capturas ── */
.cap-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: start; }
.cap-list { padding: 12px; gap: 10px; position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
.cap-list ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.cap-item { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 6px; border-radius: var(--r); cursor: pointer; }
.cap-item:hover { background: var(--surface-2); }
.cap-item.active { border-color: var(--accent); background: var(--accent-soft); }
.cap-item img { width: 88px; height: 58px; object-fit: cover; border-radius: 4px; background: var(--surface-2); }
.cap-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; align-items: flex-start; }
.cap-txt strong { font-size: 13px; font-weight: 600; line-height: 1.3; }
.cap-txt > span:not(.chip) { font-size: 11.5px; color: var(--ink-3); }
.cap-detail { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.toggles { display: flex; gap: 14px; flex-wrap: wrap; }
.views { margin: 0 18px 10px; align-self: flex-start; }
.shot { position: relative; margin: 0 18px 18px; border-radius: 6px; overflow: hidden; background: #222; aspect-ratio: 1200 / 750; max-width: 100%; }
.shot > img, .shot > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.shot-bim { mix-blend-mode: screen; transition: opacity .25s; }
.shot-bim.off { opacity: 0; }
.shot-boxes rect { fill: none; stroke-width: 3; }
.shot-boxes .tag { stroke: none; }
.shot-boxes text { font: 600 16px var(--f-mono); fill: #fff; }
.b-review rect { stroke: #2fd0e6; } .b-review .tag { fill: #0f7f91; }
.b-progress rect { stroke: #f4b23a; } .b-progress .tag { fill: #b9740a; }
.b-none rect { stroke: #d6dde2; stroke-dasharray: 8 6; } .b-none .tag { fill: #5f6b72; }
.b-unknown rect { stroke: #b6a6ee; stroke-dasharray: 3 5; } .b-unknown .tag { fill: #6a58a3; }
.shot-cta .ic { width: 20px; height: 20px; }
.shot-cta { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(10, 16, 20, .35); color: #fff; text-align: center; padding: 16px; }
.shot-cta span { font-size: 13px; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
.shot.scanning::after { content: ""; position: absolute; left: 0; right: 0; height: 30%; top: -30%; background: linear-gradient(180deg, rgba(47, 208, 230, 0) 0%, rgba(47, 208, 230, .28) 85%, rgba(160, 240, 250, .9) 100%); animation: scan 1.5s linear infinite; }
@keyframes scan { to { top: 100%; } }
.scan-status { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(10, 16, 20, .78); color: #e9f7fa; font: 500 13px var(--f-mono); padding: 8px 14px; border-radius: 4px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; z-index: 2; }
.props { list-style: none; margin: 0; padding: 0; }
.prop { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 16px; padding: 14px 18px; border-top: 1px solid var(--line); animation: rise .35s ease both; }
.prop:nth-child(2) { animation-delay: .07s; } .prop:nth-child(3) { animation-delay: .14s; } .prop:nth-child(4) { animation-delay: .21s; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.prop.resolved { background: color-mix(in srgb, var(--st-ok-soft) 35%, transparent); }
.prop-title { font-weight: 600; }
.prop-title .mono { font-size: 11.5px; margin-left: 6px; }
.prop-meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.prop-state { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.prop-state .arr { width: 14px; height: 14px; color: var(--ink-3); }
.prop-note { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.prop-side { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.conf { display: flex; align-items: center; gap: 8px; font: 500 12px var(--f-mono); color: var(--ink-2); }
.conf-bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.conf-bar i { display: block; height: 100%; background: var(--st-review); }
.conf-bar.low i { background: var(--st-unknown); }
.prop-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.resolved-by { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--st-ok); }
.done-note { display: flex; gap: 8px; align-items: center; color: var(--st-ok); border-top: 1px solid var(--line); padding-top: 14px; }

/* ── Interiores ── */
.int-layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; align-items: start; }
.int-detail { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.viv-grid { display: flex; flex-direction: column; gap: 6px; padding: 0 14px; }
.viv-row { display: grid; grid-template-columns: 26px repeat(4, minmax(0, 1fr)); gap: 6px; align-items: stretch; }
.viv-lv { font: 500 11px var(--f-mono); color: var(--ink-3); align-self: center; }
.viv { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 7px 7px 6px; display: flex; flex-direction: column; gap: 5px; text-align: left; cursor: pointer; min-width: 0; }
.viv:hover { border-color: var(--ink-3); }
.viv.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.viv-name { font: 600 12.5px var(--f-display); display: flex; align-items: center; gap: 4px; }
.dot-review { width: 7px; height: 7px; border-radius: 50%; background: var(--st-review); }
.viv-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.viv-bar i { height: 5px; border-radius: 1px; background: var(--surface-2); position: relative; overflow: hidden; }
.viv-bar i.ok { background: var(--st-ok); }
.viv-bar i.pr { background: linear-gradient(90deg, var(--st-progress) calc(var(--f) * 100% + 30%), var(--st-progress-soft) 0); }
.viv-stage { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viv-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; padding: 0 18px 12px; align-items: start; }
.plan-wrap .legend.in-card { padding: 8px 0 0; }
.plan { width: 100%; height: auto; display: block; }
.plan .room rect { stroke: var(--line); stroke-width: 1; cursor: pointer; transition: filter .15s; }
.plan .room:hover rect, .plan .room:focus rect { filter: brightness(.95); }
.plan .room.sel rect { stroke: var(--accent); stroke-width: 2.5; }
.plan .room text { fill: var(--ink); font: 600 11px var(--f-body); pointer-events: none; }
.plan .room text.area { fill: var(--ink-3); font: 10px var(--f-mono); }
.plan .room:focus { outline: none; }
.plan .ext { fill: none; stroke: var(--ink); stroke-width: 6; }
.plan .win { stroke: var(--surface); stroke-width: 4; }
.plan .wall { stroke-width: 5; stroke-linecap: square; }
.plan .w-validado { stroke: var(--st-ok); } .plan .w-ejecucion { stroke: var(--st-progress); } .plan .w-revision { stroke: var(--st-review); } .plan .w-no_iniciado { stroke: var(--ghost); }
.room-shot { margin: 0; }
.room-shot img { width: 100%; border-radius: 6px; display: block; aspect-ratio: 1200/750; object-fit: cover; }
.room-shot figcaption { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.stages-t td, .stages-t th { text-align: center; }
.stages-t td:first-child, .stages-t th:first-child { text-align: left; }
.cell { display: inline-block; width: 22px; height: 14px; border-radius: 3px; background: var(--surface-2); }
.cell.st-ok { background: var(--st-ok); } .cell.st-progress { background: var(--st-progress); } .cell.st-review { background: var(--st-review); }
.route { list-style: none; margin: 0; padding: 4px 18px 18px; }
.route li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 9px 0; position: relative; }
.route li:not(:last-child)::after { content: ""; position: absolute; left: 9px; top: 26px; bottom: -8px; width: 2px; background: var(--line); }
.r-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ghost); background: var(--surface); margin: 3px 0 0 3px; }
.r-done .r-dot { background: var(--st-ok); border-color: var(--st-ok); }
.r-now .r-dot { background: var(--st-progress); border-color: var(--st-progress); box-shadow: 0 0 0 4px var(--st-progress-soft); }
.r-body strong { display: block; font-weight: 600; }
.r-body > span { font-size: 12.5px; color: var(--ink-2); }
.r-body em { display: block; font-style: normal; font-size: 12px; color: var(--ink-3); }
.r-body em.warn-note { color: var(--st-late); font-weight: 500; }
.r-done .r-body strong { color: var(--ink-2); }
.r-alert { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; padding: 7px 10px; background: var(--st-progress-soft); border-radius: 5px; font-size: 12.5px; }
.r-alert .ic { color: var(--st-progress); width: 16px; height: 16px; }

/* ── Tablas ── */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table th.num { text-align: right; }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th:first-child, .table td:first-child { padding-left: 18px; }
.table th:last-child, .table td:last-child { padding-right: 18px; }
.table tfoot td { border-bottom: 0; padding-top: 7px; padding-bottom: 7px; color: var(--ink-2); }
.table tfoot tr:first-child td { border-top: 1px solid var(--line); padding-top: 12px; }
.table tfoot tr.total td { font-weight: 700; color: var(--ink); font-size: 15px; border-top: 1px solid var(--ink); }
.table.compact td { padding-top: 7px; padding-bottom: 7px; }
.table.subs tbody tr { cursor: pointer; }
.table.subs tbody tr:hover { background: var(--surface-2); }
.table.subs tbody tr.sel { background: var(--accent-soft); }
.stack { height: 6px; background: var(--surface-2); border-radius: 3px; position: relative; margin-top: 7px; min-width: 40px; }
.stack i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.s-ej { background: var(--st-progress); } .s-cert { background: var(--accent); } .s-pag { background: var(--st-ok); }
.lg-s-ej, .lg-s-cert, .lg-s-pag { width: 14px; height: 6px; border-radius: 3px; }
.lg-s-ej { background: var(--st-progress); } .lg-s-cert { background: var(--accent); } .lg-s-pag { background: var(--st-ok); }
.tag-model { font: 500 10px var(--f-mono); color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; margin-left: 4px; text-transform: uppercase; }
.doc-type { font: 600 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); }
.t-factura { background: var(--accent-soft); color: var(--accent); }
.t-pago { background: var(--st-ok-soft); color: var(--st-ok); }

/* ── Gantt ── */
.gantt { display: block; width: 100%; height: auto; }
.gantt .row-bg { fill: transparent; }
.gantt .g-row:nth-child(even) .row-bg { fill: var(--surface-2); opacity: .45; }
.gantt .g-name { fill: var(--ink); font: 600 12.5px var(--f-body); }
.gantt .g-sub { fill: var(--ink-3); font: 11px var(--f-body); }
.gantt .bar-plan { fill: var(--ghost); opacity: .55; }
.gantt .bar-real { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.gantt .bar-real.fc { fill: none; stroke-dasharray: 4 3; }
.gantt .bar-done { fill: var(--accent); }
.gantt .crit .bar-real { stroke: var(--st-late); }
.gantt .crit .bar-done { fill: var(--st-late); }
.gantt .crit .g-name { fill: var(--st-late); }
.gantt .g-delay { fill: var(--st-late); font: 600 11px var(--f-mono); }
.lg-planbar { width: 18px; height: 6px; background: var(--ghost); opacity: .6; border-radius: 2px; }
.lg-realbar { width: 18px; height: 9px; background: var(--accent); border-radius: 2px; }
.lg-fcbar { width: 18px; height: 9px; border: 1px dashed var(--accent); border-radius: 2px; }
.lg-crit { width: 18px; height: 9px; background: var(--st-late); border-radius: 2px; }
.devs { list-style: none; margin: 0; padding: 0 18px 10px; }
.devs li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.devs li:first-child { border-top: 0; }
.devs strong { display: block; font-weight: 600; }
.devs b { font: 600 14px var(--f-mono); white-space: nowrap; }
.replan { border-color: var(--accent); }
.bullets { margin: 8px 0 14px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* ── Datos ── */
.checks { list-style: none; margin: 0; padding: 0 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.checks strong { display: block; font-weight: 600; }
.checks span { color: var(--ink-2); font-size: 12.5px; }
.checks .ok .ic { color: var(--st-ok); } .checks .warn .ic { color: var(--st-progress); } .checks .info .ic { color: var(--ink-3); }
.links { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.links li { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 7px 10px; background: var(--surface-2); border-radius: 5px; }
.ingest { padding: 14px 18px 18px; border-top: 1px solid var(--line); }
.ingest ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.ingest li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; opacity: .45; font-size: 13px; }
.ingest li.run, .ingest li.done { opacity: 1; }
.ingest li span { color: var(--ink-2); font-size: 12.5px; display: block; }
.ing-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ghost); margin-top: 4px; }
.ingest li.run .ing-dot { border-color: var(--accent); border-top-color: transparent; animation: spin .7s linear infinite; }
.ingest li.done .ing-dot { background: var(--st-ok); border-color: var(--st-ok); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Modal y avisos flotantes ── */
.modal { position: fixed; inset: 0; background: rgba(8, 14, 18, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal-box { position: relative; background: var(--surface); border-radius: 10px; width: min(480px, 100%); padding: 22px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); max-height: calc(100vh - 32px); overflow: auto; }
.modal-box h2 { font-size: 20px; margin-bottom: 6px; }
.form { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.form label { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-top: 6px; }
.form select, .form input[type=file] { border: 1px solid var(--line); border-radius: var(--r); padding: 8px; background: var(--surface); }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#toasts { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(440px, calc(100vw - 36px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; background: var(--ink); color: var(--surface); padding: 11px 14px; border-radius: 7px; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); font-size: 13.5px; animation: rise .25s ease both; transition: opacity .35s, transform .35s; }
.toast .ic { color: var(--hivis); margin-top: 1px; }
.toast.ok .ic { color: var(--st-ok); }
.toast.out { opacity: 0; transform: translateY(6px); }

/* ── Responsive ── */
@media (max-width: 1200px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .viewer-layout, .cap-layout, .int-layout { grid-template-columns: minmax(0, 1fr); }
  .inspector, .cap-list { position: static; max-height: none; }
  .cap-list ul { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .cap-item { width: 260px; flex: none; }
}
@media (max-width: 980px) {
  .g-main, .g-2 { grid-template-columns: minmax(0, 1fr); }
  .viv-body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 30; flex-direction: row; align-items: center; padding: 8px 12px; gap: 10px; }
  .side-obra, .side-foot, .brand small { display: none; }
  .nav { flex-direction: row; overflow-x: auto; gap: 2px; scrollbar-width: none; flex: 1; min-width: 0; }
  .nav::-webkit-scrollbar { display: none; }
  .navlink { padding: 7px 9px; font-size: 13px; white-space: nowrap; }
  .navlink[aria-current="page"]::before { left: 8px; right: 8px; top: auto; bottom: -1px; width: auto; height: 2px; }
  .navlink span.lbl { display: none; }
  .navlink[aria-current="page"] span.lbl { display: inline; }
  .topbar { position: static; padding: 6px 16px; min-height: 0; }
  #view { padding: 18px 16px 40px; }
  .page-head h1 { font-size: 24px; }
  .viewer-host { height: 56vh; min-height: 300px; }
  .viewer-host.small { height: 300px; }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .kpi-value { font-size: 26px; }
  .prop { grid-template-columns: minmax(0, 1fr); }
  .shot { margin: 0 10px 12px; }
  .viv-row { grid-template-columns: 22px repeat(4, minmax(0, 1fr)); gap: 4px; }
  .viv-stage { display: none; }
  .crumbs { display: none; }
  .brand > span { display: none; }
  .steps li, .feed li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .chain.big li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .timeline output { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* ══════════ v2 · navegación, barra superior y componentes nuevos ══════════ */
.side { overflow: hidden; }
.nav { flex: 1; overflow-y: auto; min-height: 0; margin: 0 -4px; padding: 0 4px; scrollbar-width: thin; scrollbar-color: #2c3e4b transparent; }
.nav-group { display: flex; flex-direction: column; gap: 1px; margin-bottom: 10px; }
.nav-h { font: 500 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--rail-ink-2); padding: 6px 10px 3px; }
.navlink { padding: 7px 10px; font-size: 13.5px; }
.navlink .ic { width: 17px; height: 17px; }
.side-obra { display: block; text-decoration: none; }
.side-obra:hover { border-color: #3a4e5c; }
.topbar { flex-wrap: wrap; row-gap: 6px; }
#crumbs a { color: var(--ink-2); text-decoration: none; }
#crumbs a:hover { color: var(--accent); }
#topActions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.search-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-3); border-radius: var(--r); padding: 6px 10px; cursor: pointer; font-size: 13px; min-width: 0; }
.search-btn:hover { border-color: var(--ink-3); color: var(--ink-2); }
.search-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--ink-3); background: var(--bg); }
.net { color: var(--ink-2); font-size: 12.5px; }
.net.off { color: var(--st-progress); background: var(--st-progress-soft); }
.role-pick { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-3); font-size: 12.5px; }
.role-pick select { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 5px 6px; font-size: 12.5px; color: var(--ink); }
.bell { position: relative; }
.bell b { position: absolute; top: -3px; right: -4px; background: var(--st-late); color: #fff; font: 600 10px/16px var(--f-mono); min-width: 16px; border-radius: 8px; text-align: center; padding: 0 3px; }
.menu-btn { display: none; }
#banner { display: flex; flex-direction: column; }
.banner-row { display: flex; gap: 8px; align-items: center; padding: 7px 28px; font-size: 13px; background: var(--st-progress-soft); color: var(--ink); border-bottom: 1px solid var(--line); }
.banner-row .ic { color: var(--st-progress); width: 16px; height: 16px; }
.empty-page { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 80px 16px; text-align: center; }
.empty-page .ic { width: 40px; height: 40px; color: var(--ink-3); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pad-x { padding: 0 18px 16px; margin: 0; }
.clk { cursor: pointer; }
.clk:hover strong { color: var(--accent); }
.pos { color: var(--st-ok); }
.kpi.link { text-align: left; cursor: pointer; font: inherit; color: inherit; }
.kpi.link:hover { border-color: var(--ink-3); }
.upd { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; text-transform: none; letter-spacing: 0; color: var(--ink-3); font-size: 10.5px; }
.upd .ic { width: 11px; height: 11px; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-align: left; }
.linkish:hover { text-decoration: underline; }

/* Documentación */

.req-ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); }
.req-ic .ic { width: 14px; height: 14px; }
.r-cargado .req-ic { background: var(--st-ok-soft); color: var(--st-ok); }
.r-caducado .req-ic { background: var(--st-late-soft); color: var(--st-late); }
.r-revision .req-ic { background: var(--st-review-soft); color: var(--st-review); }
.reqs strong { display: block; font-weight: 600; font-size: 13.5px; }
.docname, td a { display: inline-flex; gap: 6px; align-items: center; }

td a .ic, .docname .ic { width: 15px; height: 15px; color: var(--ink-3); }
.req-cfg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.req-cfg ul { list-style: none; padding: 0; margin: 0; }
.req-cfg li { display: flex; justify-content: space-between; align-items: center; font-size: 13px; border-bottom: 1px solid var(--line); padding: 2px 0; }
.plano-wrap { position: relative; margin: 0 18px 10px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }

.plano .pl-old { stroke: var(--st-late); stroke-width: 3; stroke-dasharray: 6 4; opacity: .85; }
.plano .pl-lbl { fill: var(--ink); font: 700 13px var(--f-display); }
.plano .pl-room { fill: var(--ink-3); font: 10.5px var(--f-body); }
.plano .pl-ele { fill: var(--st-progress); }
.plano .pl-fon { fill: none; stroke: #2f6fb3; stroke-width: 2.5; }
.plano .pl-fonp { fill: #2f6fb3; }
.plano .pl-axis { stroke: var(--ink-3); stroke-width: .8; stroke-dasharray: 10 4 2 4; }
.plano .pl-ax { fill: var(--ink-2); font: 600 12px var(--f-mono); }
.plano .pl-slab { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; opacity: .7; }
.plano .pl-col { fill: var(--ink); }
.plano .pl-zap { fill: none; stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
.plano .pl-win { fill: var(--accent-soft); stroke: var(--accent); }
.pin { position: absolute; transform: translate(-50%, -100%); width: 24px; height: 24px; border-radius: 50% 50% 50% 0; rotate: -45deg; background: var(--st-late); color: #fff; border: 2px solid var(--surface); font: 700 11px var(--f-mono); cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow); }
.pin.other { background: var(--ghost); }
.notes { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; }

/* Calidad, diario, reuniones */
.ws { display: flex; gap: 4px; margin-top: 12px; }
.ws span { flex: 1; text-align: center; font-size: 11px; padding: 4px 2px; border-radius: 4px; background: var(--surface-2); color: var(--ink-3); }
.ws span.on { background: var(--st-ok-soft); color: var(--st-ok); font-weight: 600; }
.inc-photo { width: 100%; border-radius: 6px; margin-bottom: 6px; }
.checklist { list-style: none; margin: 0; padding: 0 18px 14px; display: flex; flex-direction: column; gap: 4px; }
.dia-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; align-items: start; }
.dia-list { list-style: none; margin: 0; padding: 6px; }
.dia-list button { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 6px; cursor: pointer; }
.dia-list button:hover { background: var(--surface-2); }
.dia-list button.active { background: var(--accent-soft); }
.dia-list span { font-size: 12px; color: var(--ink-3); }
.dia-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 22px; }
.dia-body section:first-child { grid-column: 1 / -1; }
.dia-body p { margin: 0; }
.emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.emp-grid input { width: 64px !important; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 0 18px 18px; }
.gallery .ph { margin: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.gallery img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
.gallery figcaption { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.gallery figcaption span { color: var(--ink-3); font-size: 11.5px; }
.evo-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 0 18px; }
.evo-strip figure { margin: 0; opacity: .65; }
.evo-strip figure.on { opacity: 1; }
.evo-strip img { width: 100%; border-radius: 4px; display: block; }
.evo-strip figcaption { font: 500 11px var(--f-mono); color: var(--ink-3); text-align: center; margin-top: 3px; }
.cmp-sel { margin-bottom: 10px; max-width: 520px; }
.compare { position: relative; border-radius: 6px; overflow: hidden; aspect-ratio: 1200 / 750; max-width: 900px; }
.compare > img { width: 100%; height: 100%; display: block; object-fit: cover; }
.cmp-before { position: absolute; inset: 0 auto 0 0; width: 50%; overflow: hidden; border-right: 2px solid #fff; }
.cmp-before img { height: 100%; width: auto; max-width: none; aspect-ratio: 1200 / 750; display: block; }
.compare input { position: absolute; left: 0; right: 0; bottom: 12px; width: 60%; margin: 0 auto; accent-color: var(--hivis); }
.cmp-l, .cmp-r { position: absolute; top: 10px; background: rgba(10, 16, 20, .7); color: #fff; font: 500 11.5px var(--f-mono); padding: 3px 7px; border-radius: 3px; }
.cmp-l { left: 10px; } .cmp-r { right: 10px; }
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.kcol { background: var(--surface-2); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.kcol .mini { margin: 2px 2px 4px; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; box-shadow: var(--shadow); }
.kcard strong { font-weight: 600; font-size: 13.5px; }

/* Informes */
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.tpl { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px; cursor: pointer; }
.tpl .ic { color: var(--accent); }
.tpl span { font-size: 11.5px; color: var(--ink-3); }
.tpl.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.inf-cfg { display: flex; flex-direction: column; gap: 10px; }
.sec-checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; }
.report { background: var(--surface-2); padding: 18px; border-radius: 0 0 8px 8px; overflow: auto; }
.rep-page { background: #fff; color: #15212a; max-width: 820px; margin: 0 auto; padding: 36px 42px; box-shadow: 0 4px 20px rgba(0,0,0,.12); font-size: 13px; }
.rep-page h1 { font-size: 24px; margin: 6px 0; color: #15212a; }
.rep-page h2 { font-size: 15px; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #f2b705; color: #15212a; }
.rep-page .table td, .rep-page .table th { color: #15212a; border-color: #dde2e0; }
.rep-head { display: flex; justify-content: space-between; font: 500 10.5px var(--f-mono); color: #6d7a82; }
.rep-brand { letter-spacing: .1em; }
.rep-sub { color: #48565f; margin: 0 0 14px; }
.rep-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.rep-kpis div { border: 1px solid #dde2e0; border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; }
.rep-kpis span { font-size: 11px; color: #6d7a82; }
.rep-kpis b { font: 700 18px var(--f-display); }
.rep-chart { --line: #dde2e0; --ink-3: #7a868d; --ink-2: #48565f; --accent: #1c5f8f; --st-ok: #2f8a57; --st-late: #c3412b; --hivis: #f2b705; --surface: #fff; }
.rep-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rep-photos figure { margin: 0; }
.rep-photos img { width: 100%; border-radius: 4px; }
.rep-photos figcaption { font-size: 10.5px; color: #6d7a82; }

/* Datos y permisos */
.integ { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; padding: 0 18px 18px; }
.integ-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; gap: 8px; }
.perm td, .perm th { text-align: center; white-space: nowrap; }
.perm td:first-child, .perm th:first-child { text-align: left; }
.perm-sel { border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; font-size: 12px; background: var(--surface); color: var(--ink); }
.perm-tag { font-size: 11.5px; padding: 1px 6px; border-radius: 4px; }
.p-none { color: var(--ink-3); } .p-view { background: var(--surface-2); } .p-edit { background: var(--st-progress-soft); color: var(--st-progress); } .p-approve { background: var(--st-ok-soft); color: var(--st-ok); }
.perm-sel.p-none, .perm-sel.p-view { background: var(--surface); }

@media (max-width: 1200px) {
  .g-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .doc-layout, .dia-layout { grid-template-columns: minmax(0, 1fr); }

  .flow5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .side { position: fixed; inset: 0 auto 0 0; width: 270px; height: 100%; z-index: 40; flex-direction: column; align-items: stretch; padding: 18px 12px; transform: translateX(-102%); transition: transform .2s; }

  .side-foot { display: flex; }
  .nav { flex-direction: column; overflow-y: auto; }
  .navlink { white-space: normal; }

  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); padding: 8px 16px; }
  .banner-row { padding: 7px 16px; }
  .search-btn span, .search-btn kbd { display: none; }
  .net span { display: none; }
}
@media (max-width: 560px) {
  .brand > span { display: inline; }
  .role-pick .ic { display: none; }
  .row2, .conflict, .sec-checks, .req-cfg, .val-grid, .links-grid, .dia-body { grid-template-columns: minmax(0, 1fr); }
  .obras { grid-template-columns: minmax(0, 1fr); }

  .reqs li { grid-template-columns: 26px minmax(0, 1fr); }

}
